<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ငွေစာရင်း</title>
<style>
:root{
  --bg:#f2f5f4;--card:#fff;--text:#15201d;--muted:#687873;--line:#e2e8e6;
  --pri:#0f766e;--pri-2:#115e59;--pri-soft:#dff2ee;
  --in:#15803d;--in-soft:#e5f4ea;--out:#dc2626;--out-soft:#fdecec;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1412;--card:#18211e;--text:#e7eeeb;--muted:#93a39e;--line:#27322f;
  --pri:#14b8a6;--pri-2:#0f766e;--pri-soft:#123a35;
  --in:#4ade80;--in-soft:#15301f;--out:#f87171;--out-soft:#3a1818;
  --shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,"Noto Sans Myanmar","Pyidaungsu","Myanmar Text",sans-serif;line-height:1.65;font-size:15px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 120px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 0 8px}
.top{max-width:560px;margin:0 auto;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.top h1{font-size:18px;margin:0;font-weight:700}
.month{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px}
.month button{width:34px;height:34px;border-radius:50%;font-size:18px;color:var(--muted)}
.month span{min-width:118px;text-align:center;font-weight:600;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-top:12px}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri-2));color:#fff;border:0;padding:18px}
.hero .lbl{opacity:.85;font-size:13px}
.hero .amt{font-size:30px;font-weight:700;letter-spacing:.3px;line-height:1.3}
.hero .amt small{font-size:14px;font-weight:500;opacity:.85}
.hero .row{display:flex;gap:10px;margin-top:12px}
.hero .row>div{flex:1;background:rgba(255,255,255,.14);border-radius:12px;padding:8px 10px}
.hero .row span{display:block;font-size:12px;opacity:.85}
.hero .row b{font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{margin-top:0}
.mini .t{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:4px}
.kv{display:flex;justify-content:space-between;font-size:14px}
.kv b{font-weight:600}
.profit{border-top:1px dashed var(--line);margin-top:6px;padding-top:6px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.trio span{display:block;font-size:12px;color:var(--muted)}
.trio b{font-size:15px}
.in{color:var(--in)}.out{color:var(--out)}
.banner{display:flex;align-items:center;gap:10px;background:#fff7e6;color:#7a4b00;border:1px solid #f6d58c;border-radius:14px;padding:10px 12px;margin-top:12px;font-size:14px}
@media (prefers-color-scheme:dark){.banner{background:#3a2c0d;color:#f8d98a;border-color:#5c4615}}
.banner button{margin-left:auto;background:#7a4b00;color:#fff;border-radius:10px;padding:6px 12px;font-size:13px;white-space:nowrap}
@media (prefers-color-scheme:dark){.banner button{background:#f8d98a;color:#3a2c0d}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.day{margin-top:14px}
.dayh{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:0 4px 4px}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.ic.i{background:var(--in-soft)}.ic.o{background:var(--out-soft)}
.item .mid{flex:1;min-width:0}
.item .nm{font-weight:600;font-size:15px}
.item .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .am{font-weight:700;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.empty div{font-size:40px}
h2{font-size:15px;margin:18px 4px 0;color:var(--muted);font-weight:600}
.bar{margin:8px 0}
.bar .bl{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.bar .bl span:last-child{white-space:nowrap;font-weight:600}
.track{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:3px}
.fill{height:100%;border-radius:99px}
.fill.i{background:var(--in)}.fill.o{background:var(--out)}
.trend{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:6px}
.tcol{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.tbars{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.tbars div{width:40%;max-width:16px;border-radius:5px 5px 0 0;min-height:2px}
.tcol small{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border-radius:12px;font-weight:600;background:var(--pri-soft);color:var(--pri);margin-top:8px}
.btn.solid{background:var(--pri);color:#fff}
.btn.danger{background:var(--out-soft);color:var(--out)}
.muted{color:var(--muted);font-size:13px}
.crow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 2px;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow .nm{flex:1}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--pri-soft);color:var(--pri);white-space:nowrap}
.tag.p{background:var(--line);color:var(--muted)}
.tag.c{background:#fdeedd;color:#b45309}
@media (prefers-color-scheme:dark){.tag.c{background:#3b2a12;color:#fbbf6b}}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav .in-nav{max-width:560px;margin:0 auto;display:flex}
nav button{flex:1;padding:8px 0 6px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
nav button b{font-size:20px;line-height:1.2;font-weight:400}
nav button.on{color:var(--pri);font-weight:600}
.fab{position:fixed;right:max(18px,calc(50vw - 262px));bottom:calc(76px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;background:var(--pri);color:#fff;font-size:32px;line-height:1;box-shadow:0 6px 18px rgba(15,118,110,.4);z-index:7}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sh h3{margin:0;font-size:17px}
.x{width:36px;height:36px;border-radius:50%;background:var(--bg);font-size:18px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button.on.i{background:var(--in);color:#fff}
.seg button.on.o{background:var(--out);color:#fff}
.seg button.on.n{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.amtbox{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);margin:14px 0 6px;padding:4px 2px}
.amtbox:focus-within{border-color:var(--pri)}
.amtbox input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:32px;font-weight:700;padding:0}
.amtbox span{color:var(--muted)}
.lab{font-size:13px;color:var(--muted);font-weight:600;margin:12px 0 6px}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:12px;border:1.5px solid var(--line);font-size:12px;line-height:1.35;text-align:center;word-break:break-word}
.cb b{font-size:22px;font-weight:400;line-height:1.2}
.cb.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri);font-weight:600}
.field{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);outline:0}
.field:focus{border-color:var(--pri)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#15201d;color:#fff;padding:9px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{color:var(--muted);font-weight:600}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl tr[data-act]{cursor:pointer}
.tbl tr.tot td{font-weight:700;border-bottom:0}
button.tcol{padding:0}
.lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px 24px calc(24px + env(safe-area-inset-bottom))}
.lock.open{display:flex}
.lock .lt{font-size:18px;font-weight:700;margin-top:8px}
.lock .le{color:var(--out);font-size:14px;min-height:24px;margin-top:6px}
.dots{display:flex;gap:14px;margin:18px 0 4px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--pri)}
.dots i.f{background:var(--pri)}
.dots.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:none}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;margin-top:22px}
.pad button{height:76px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:28px;font-weight:500;box-shadow:var(--shadow)}
.pad button.g{background:none;border:0;box-shadow:none;font-size:15px;color:var(--muted)}
.lock .lk{margin-top:18px;color:var(--muted);font-size:13px;text-decoration:underline}
</style>
</head>
<body>
<header><div class="top">
  <h1>💰 ငွေစာရင်း</h1>
  <div class="month" id="monthNav">
    <button data-act="prev" aria-label="ယခင်လ">‹</button>
    <span id="monthLabel"></span>
    <button data-act="next" aria-label="နောက်လ">›</button>
  </div>
</div></header>

<main class="wrap" id="main"></main>

<button class="fab" data-act="add" aria-label="စာရင်းအသစ်ထည့်ရန်">+</button>

<nav><div class="in-nav">
  <button data-act="nav" data-view="home"><b>📒</b>မှတ်တမ်း</button>
  <button data-act="nav" data-view="report"><b>📊</b>အစီရင်ခံ</button>
  <button data-act="nav" data-view="settings"><b>⚙️</b>ဆက်တင်</button>
</div></nav>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<input type="file" id="restoreFile" hidden>
<div class="toast" id="toast"></div>
<div class="lock" id="lock"></div>

<script>
'use strict';
const APP_VERSION='1.4';
const GROUPS={school:'ကွန်ပျူတာသင်တန်း',chinese:'တရုတ်ကျောင်း',personal:'ကိုယ်ပိုင်'};
const IN_GROUPS=['school','chinese'], OUT_GROUPS=['school','personal'];
const MONTHS=['ဇန်နဝါရီ','ဖေဖော်ဝါရီ','မတ်','ဧပြီ','မေ','ဇွန်','ဇူလိုင်','ဩဂုတ်','စက်တင်ဘာ','အောက်တိုဘာ','နိုဝင်ဘာ','ဒီဇင်ဘာ'];
const MSHORT=['ဇန်','ဖေ','မတ်','ဧပြီ','မေ','ဇွန်','ဇူ','ဩ','စက်','အောက်','နို','ဒီ'];
const DAYS=['တနင်္ဂနွေ','တနင်္လာ','အင်္ဂါ','ဗုဒ္ဓဟူး','ကြာသပတေး','သောကြာ','စနေ'];
const METHODS=['Cash','KPay','Wave','Bank'];
const DEFAULT_CATS=[
  {id:'i1',type:'in',name:'သင်တန်းကြေး',icon:'💻',group:'school'},
  {id:'i2',type:'in',name:'မိတ္တူကူး',icon:'📄',group:'school'},
  {id:'i3',type:'in',name:'ဝန်ဆောင်မှု',icon:'🛠️',group:'school'},
  {id:'i4',type:'in',name:'လစာ',icon:'💵',group:'chinese'},
  {id:'i5',type:'in',name:'အခြား',icon:'🎁',group:'chinese'},
  {id:'o1',type:'out',name:'ဆီဖိုး',icon:'⛽',group:'personal'},
  {id:'o2',type:'out',name:'ဝန်ထမ်းခ',icon:'👥',group:'school'},
  {id:'o3',type:'out',name:'မီးဖိုး',icon:'💡',group:'school'},
  {id:'o4',type:'out',name:'အိမ်ငှားခ',icon:'🏠',group:'school'},
  {id:'o12',type:'out',name:'ဖုန်း/အင်တာနက်',icon:'📶',group:'school'},
  {id:'o13',type:'out',name:'စက္ကူ/မင်',icon:'🖨️',group:'school'},
  {id:'o14',type:'out',name:'စက်ပြုပြင်',icon:'🔧',group:'school'},
  {id:'o5',type:'out',name:'အစားအသောက်',icon:'🍜',group:'personal'},
  {id:'o6',type:'out',name:'ဆေးဝါး',icon:'💊',group:'personal'},
  {id:'o7',type:'out',name:'AI',icon:'🤖',group:'personal'},
  {id:'o8',type:'out',name:'ဂိမ်း',icon:'🎮',group:'personal'},
  {id:'o9',type:'out',name:'အလှူငွေ',icon:'🙏',group:'personal'},
  {id:'o10',type:'out',name:'အဝတ်အစား',icon:'👕',group:'personal'},
  {id:'o11',type:'out',name:'Gym',icon:'🏋️',group:'personal'},
  {id:'o15',type:'out',name:'အခြား',icon:'📦',group:'personal'}
];

const pad=n=>String(n).padStart(2,'0');
const ymOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const todayStr=()=>{const d=new Date();return ymOf(d)+'-'+pad(d.getDate());};
const fmt=n=>Math.round(n).toLocaleString('en-US');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);

const S={tx:[],cats:[],meta:{},ym:ymOf(new Date()),filter:'all',view:'home',rmode:'month',persisted:null};
let F=null, CF=null;

/* ---------- IndexedDB ---------- */
let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('ngwe-db',1);
  r.onupgradeneeded=()=>{const d=r.result;
    if(!d.objectStoreNames.contains('tx'))d.createObjectStore('tx',{keyPath:'id'});
    if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'key'});};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
const p=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const os=(n,m)=>db.transaction(n,m).objectStore(n);
const dbAll=n=>p(os(n,'readonly').getAll());
const dbPut=(n,v)=>p(os(n,'readwrite').put(v));
const dbDel=(n,k)=>p(os(n,'readwrite').delete(k));
async function setMeta(k,v){S.meta[k]=v;await dbPut('meta',{key:k,value:v});}
function dbReplaceAll(txs,cats){return new Promise((res,rej)=>{
  const t=db.transaction(['tx','meta'],'readwrite');const s=t.objectStore('tx');
  s.clear();txs.forEach(x=>s.put(x));t.objectStore('meta').put({key:'cats',value:cats});
  t.oncomplete=res;t.onerror=()=>rej(t.error);});}

/* ---------- helpers ---------- */
const cat=id=>S.cats.find(c=>c.id===id)||{name:'(ဖျက်ထားသည်)',icon:'❔',group:'personal'};
const monthTx=ym=>S.tx.filter(t=>t.date.startsWith(ym));
function sums(list){const s={in:0,out:0,schoolIn:0,chineseIn:0,schoolOut:0,personalOut:0};
  for(const t of list){if(t.type==='in'){s.in+=t.amount;t.group==='chinese'?s.chineseIn+=t.amount:s.schoolIn+=t.amount;}
    else{s.out+=t.amount;t.group==='school'?s.schoolOut+=t.amount:s.personalOut+=t.amount;}}
  return s;}
const shiftYm=(ym,n)=>{const [y,m]=ym.split('-').map(Number);return ymOf(new Date(y,m-1+n,1));};
const daysSince=ts=>ts?(Date.now()-ts)/864e5:Infinity;
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800);}
const signed=(n)=>(n<0?'-':'')+fmt(Math.abs(n));

/* ---------- render ---------- */
function render(){
  const [y,m]=S.ym.split('-').map(Number);
  $('monthLabel').textContent=(S.view==='report'&&S.rmode==='year')?y+' ခုနှစ်':MONTHS[m-1]+' '+y;
  $('monthNav').style.visibility=S.view==='settings'?'hidden':'visible';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===S.view));
  document.querySelector('.fab').style.display=S.view==='settings'?'none':'';
  $('main').innerHTML=S.view==='home'?homeHTML():S.view==='report'?reportHTML():settingsHTML();
}

function homeHTML(){
  const list=monthTx(S.ym), s=sums(list), bal=s.in-s.out, prof=s.schoolIn-s.schoolOut;
  let h='';
  const ds=daysSince(S.meta.lastBackup);
  if(S.tx.length&&ds>=7) h+=`<div class="banner">💾 <div>${S.meta.lastBackup?`Backup မထုတ်တာ ${Math.floor(ds)} ရက်ရှိပြီ`:'Backup တစ်ခါမှ မထုတ်ရသေးပါ'}</div><button data-act="backup">Backup ထုတ်</button></div>`;
  h+=`<section class="card hero"><div class="lbl">ဒီလ လက်ကျန်</div>
    <div class="amt">${signed(bal)} <small>ကျပ်</small></div>
    <div class="row"><div><span>ဝင်ငွေ</span><b>+${fmt(s.in)}</b></div><div><span>ထွက်ငွေ</span><b>-${fmt(s.out)}</b></div></div></section>`;
  h+=`<section class="card"><div class="mini"><div class="t">💻 ကွန်ပျူတာသင်တန်း</div></div>
    <div class="trio"><div><span>ဝင်ငွေ</span><b class="in">${fmt(s.schoolIn)}</b></div>
    <div><span>ထွက်ငွေ</span><b class="out">${fmt(s.schoolOut)}</b></div>
    <div><span>အမြတ်</span><b class="${prof<0?'out':'in'}">${signed(prof)}</b></div></div></section>`;
  h+=`<div class="grid2" style="margin-top:10px"><div class="card mini"><div class="t">🀄 တရုတ်ကျောင်း</div><div class="kv"><span>ဝင်ငွေ</span><b class="in">${fmt(s.chineseIn)}</b></div></div>
    <div class="card mini"><div class="t">🙋 ကိုယ်ပိုင်အသုံး</div><div class="kv"><span>ထွက်ငွေ</span><b class="out">${fmt(s.personalOut)}</b></div></div></div>`;
  const fs=[['all','အားလုံး'],['in','ဝင်ငွေ'],['out','ထွက်ငွေ'],['school','သင်တန်း'],['chinese','တရုတ်ကျောင်း'],['personal','ကိုယ်ပိုင်']];
  h+=`<div class="chips">${fs.map(([k,v])=>`<button class="chip ${S.filter===k?'on':''}" data-act="filter" data-f="${k}">${v}</button>`).join('')}</div>`;
  const f=S.filter;
  const shown=list.filter(t=>f==='all'||t.type===f||t.group===f)
    .sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);
  if(!shown.length) return h+`<div class="empty"><div>📭</div>${list.length?'ဒီအမျိုးအစား စာရင်းမရှိပါ':'ဒီလအတွက် စာရင်းမရှိသေးပါ<br>အောက်က <b>+</b> ကိုနှိပ်ပြီး ထည့်ပါ'}</div>`;
  const byDay={};shown.forEach(t=>(byDay[t.date]=byDay[t.date]||[]).push(t));
  for(const d of Object.keys(byDay)){
    const [yy,mm,dd]=d.split('-').map(Number), w=new Date(yy,mm-1,dd).getDay();
    const net=byDay[d].reduce((a,t)=>a+(t.type==='in'?t.amount:-t.amount),0);
    h+=`<div class="day"><div class="dayh"><span>${dd} ${MONTHS[mm-1]} · ${DAYS[w]}</span><span class="${net<0?'out':'in'}">${net<0?'':'+'}${signed(net)}</span></div><div class="list">`;
    for(const t of byDay[d]){const c=cat(t.catId);
      const sub=[GROUPS[t.group],t.method,t.note].filter(Boolean).map(esc).join(' · ');
      h+=`<button class="item" data-act="open" data-id="${t.id}"><div class="ic ${t.type==='in'?'i':'o'}">${esc(c.icon)}</div>
        <div class="mid"><div class="nm">${esc(c.name)}</div><div class="sub">${sub}</div></div>
        <div class="am ${t.type}">${t.type==='in'?'+':'-'}${fmt(t.amount)}</div></button>`;}
    h+='</div></div>';
  }
  return h;
}

function barsHTML(list,type){
  const tot={};list.filter(t=>t.type===type).forEach(t=>tot[t.catId]=(tot[t.catId]||0)+t.amount);
  const rows=Object.entries(tot).sort((a,b)=>b[1]-a[1]);
  if(!rows.length) return '<div class="muted">စာရင်းမရှိသေးပါ</div>';
  const max=rows[0][1], sum=rows.reduce((a,r)=>a+r[1],0);
  return rows.map(([id,v])=>{const c=cat(id);return `<div class="bar"><div class="bl"><span>${esc(c.icon)} ${esc(c.name)} <span class="muted">${Math.round(v/sum*100)}%</span></span><span>${fmt(v)}</span></div>
    <div class="track"><div class="fill ${type==='in'?'i':'o'}" style="width:${Math.max(2,v/max*100)}%"></div></div></div>`;}).join('');
}

function trendHTML(months,title){

  return `<section class="card"><div class="muted" style="font-weight:600">${title}</div>
    <div class="trend">${months.map(([ym,x])=>{const m=+ym.slice(5);return `<button class="tcol" data-act="gomonth" data-ym="${ym}"><div class="tbars">
      <div style="height:${x.in/mx*100}%;background:var(--in)"></div><div style="height:${x.out/mx*100}%;background:var(--out)"></div></div>
      <small style="${ym===S.ym?'color:var(--text);font-weight:700':''}">${MSHORT[m-1]}</small></button>`;}).join('')}</div>

/* ---------- backup / restore / csv ---------- */
async function shareOrDownload(content,base,types){
  for(const [mime,ext] of types){
    const file=new File([content],base+ext,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:base+ext});return 'shared';}
      catch(e){if(e.name==='AbortError')return 'cancel';}
    }
  }
  const [mime,ext]=types[0];
  const url=URL.createObjectURL(new Blob([content],{type:mime}));
  const a=document.createElement('a');a.href=url;a.download=base+ext;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);return 'downloaded';
}
async function backup(){
  const data=JSON.stringify({app:'ngwe',version:1,exported:new Date().toISOString(),categories:S.cats,tx:S.tx});
  const r=await shareOrDownload(data,'ngwe-backup-'+todayStr(),[['application/json','.json'],['text/plain','.txt']]);
  if(r==='cancel')return;
  await setMeta('lastBackup',Date.now());render();
  toast(r==='shared'?'Backup ထုတ်ပြီးပါပြီ ✓':'Downloads ထဲ သိမ်းပြီးပါပြီ ✓');
}
async function restore(file){
  let d;try{d=JSON.parse(await file.text());}catch(e){alert('ဒီ file က backup file မဟုတ်ပါ');return;}
  if(!d||d.app!=='ngwe'||!Array.isArray(d.tx)||!Array.isArray(d.categories)){alert('ဒီ file က ငွေစာရင်း backup file မဟုတ်ပါ');return;}
  const when=d.exported?new Date(d.exported).toLocaleDateString('en-GB'):'';
  if(!confirm(`Backup (${when}, စာရင်း ${d.tx.length} ခု) ကို ပြန်သွင်းမှာပါ။\nလက်ရှိစာရင်း ${S.tx.length} ခုကို အစားထိုးသွားပါမယ်။ ဆက်လုပ်မလား?`))return;
  await dbReplaceAll(d.tx,d.categories);S.tx=d.tx;S.cats=d.categories;S.meta.cats=d.categories;
  render();toast('ပြန်သွင်းပြီးပါပြီ ✓');
}
async function exportCsv(){
  const q=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const rows=[['ရက်စွဲ','အမျိုးအစား','ကဏ္ဍ','Category','ပမာဏ','ငွေပေးချေနည်း','မှတ်ချက်']];
  [...S.tx].sort((a,b)=>a.date.localeCompare(b.date)||a.created-b.created).forEach(t=>
    rows.push([t.date,t.type==='in'?'ဝင်ငွေ':'ထွက်ငွေ',GROUPS[t.group],cat(t.catId).name,t.amount,t.method,t.note]));
  const csv='\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n');
  const r=await shareOrDownload(csv,'ngwe-'+todayStr(),[['text/csv','.csv']]);
  if(r!=='cancel')toast('Excel file ထုတ်ပြီးပါပြီ ✓');
}

/* ---------- PIN lock ---------- */
let L=null, hiddenAt=0;
async function hashPin(pin,salt){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pin));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
const LT={unlock:'PIN ထည့်ပါ',verify:'လက်ရှိ PIN ထည့်ပါ',set1:'PIN အသစ် (ဂဏန်း ၆ လုံး)',set2:'PIN ကို ထပ်ရိုက်ပါ'};
const pinLen=()=>(L&&(L.mode==='unlock'||L.mode==='verify')&&S.meta.pin&&S.meta.pin.len)||(L&&(L.mode==='unlock'||L.mode==='verify')&&S.meta.pin?4:6);
function openLock(mode,cb){L={mode,buf:'',first:null,cb,err:'',tries:0,wait:0};$('lock').classList.add('open');drawLock();}
function closeLock(){$('lock').classList.remove('open');L=null;}
function drawLock(shake){
  const w=L.wait>Date.now();
  $('lock').innerHTML=`<div style="font-size:42px">${L.mode==='unlock'?'🔒':'🔑'}</div><div class="lt">${LT[L.mode]}</div>
  <div class="dots ${shake?'shake':''}">${[...Array(pinLen()).keys()].map(i=>`<i class="${i<L.buf.length?'f':''}"></i>`).join('')}</div>
  <div class="le">${w?'မှားလွန်းလို့ စက္ကန့် ၃၀ စောင့်ပါ':L.err}</div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="pk" data-k="${n}">${n}</button>`).join('')}
  ${L.mode==='unlock'?'<span></span>':'<button class="g" data-act="pkcancel">မလုပ်တော့</button>'}<button data-act="pk" data-k="0">0</button><button class="g" data-act="pkdel">⌫</button></div>
  ${L.mode==='unlock'?'<button class="lk" data-act="pkforgot">PIN မေ့သွားပြီ</button>':''}`;
}
async function pinKey(k){
  if(!L||L.wait>Date.now()||L.buf.length>=pinLen())return;
  L.buf+=k;L.err='';drawLock();
  if(L.buf.length<pinLen())return;
  const v=L.buf;
  if(L.mode==='unlock'||L.mode==='verify'){
    const ok=await hashPin(v,S.meta.pin.salt)===S.meta.pin.hash;
    if(ok){const cb=L.cb;closeLock();cb&&cb();return;}
    L.tries++;L.buf='';L.err='PIN မှားနေပါတယ်';
    if(L.tries>=5){L.tries=0;L.wait=Date.now()+30000;setTimeout(()=>L&&drawLock(),30100);}
    drawLock(true);
  }else if(L.mode==='set1'){L.first=v;L.mode='set2';L.buf='';setTimeout(drawLock,150);}
  else{
    if(v!==L.first){L.mode='set1';L.buf='';L.first=null;L.err='PIN မတူပါ၊ ပြန်ထည့်ပါ';drawLock(true);return;}
    const salt=uid()+uid();await setMeta('pin',{salt,len:6,hash:await hashPin(v,salt)});
    const cb=L.cb;closeLock();cb&&cb();
  }
}
async function pinForgot(){
  if(!confirm('PIN မေ့သွားရင် app ထဲက data အားလုံးကို ဖျက်ပြီး အသစ်ပြန်စရပါမယ်။\nပြီးမှ Google Drive ထဲက backup ကို ပြန်သွင်းလို့ရပါတယ်။\nဆက်လုပ်မလား?'))return;
  if(!confirm('တကယ်ဖျက်မှာ သေချာလား? (Backup မရှိရင် data ပြန်မရနိုင်ပါ)'))return;
  await new Promise((res,rej)=>{const t=db.transaction(['tx','meta'],'readwrite');t.objectStore('tx').clear();t.objectStore('meta').clear();t.oncomplete=res;t.onerror=()=>rej(t.error);});
  location.reload();
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();return;}
  if(S.meta.pin&&!L&&hiddenAt&&Date.now()-hiddenAt>60000){closeSheet();openLock('unlock');}
});

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b){if(e.target===$('ov'))closeSheet();return;}
  const a=b.dataset.act;
  switch(a){
    case 'nav':S.view=b.dataset.view;render();scrollTo(0,0);break;
    case 'prev':S.ym=shiftYm(S.ym,(S.view==='report'&&S.rmode==='year')?-12:-1);render();break;
    case 'next':S.ym=shiftYm(S.ym,(S.view==='report'&&S.rmode==='year')?12:1);render();break;
    case 'rmode':S.rmode=b.dataset.v;render();break;
    case 'gomonth':S.ym=b.dataset.ym;S.rmode='month';render();scrollTo(0,0);break;
    case 'filter':S.filter=b.dataset.f;render();break;
    case 'add':openForm(null);break;
    case 'open':openForm(S.tx.find(t=>t.id===b.dataset.id));break;
    case 'type':if(F.type!==b.dataset.v){F.type=b.dataset.v;F.catId=null;F.group=null;formHTML();}break;
    case 'pick':F.catId=b.dataset.id;F.group=cat(F.catId).group;formHTML();break;
    case 'grp':F.group=b.dataset.v;formHTML();break;
    case 'save':saveTx();break;
    case 'del':delTx();break;
    case 'close':closeSheet();break;
    case 'backup':backup();break;
    case 'restore':$('restoreFile').click();break;
    case 'csv':exportCsv();break;
    case 'editcat':openCat(S.cats.find(c=>c.id===b.dataset.id));break;
    case 'addcat':openCat(null,b.dataset.type);break;
    case 'cgrp':CF.group=b.dataset.v;CF.name=$('cName').value;CF.icon=$('cIcon').value;openCat(CF,CF.type);break;
    case 'savecat':saveCat();break;
    case 'delcat':delCat();break;
    case 'pk':pinKey(b.dataset.k);break;
    case 'pkdel':if(L){L.buf=L.buf.slice(0,-1);drawLock();}break;
    case 'pkcancel':closeLock();break;
    case 'pkforgot':pinForgot();break;
    case 'pinset':openLock('set1',()=>{render();toast('PIN ထည့်ပြီးပါပြီ 🔒');});break;
    case 'pinchange':openLock('verify',()=>openLock('set1',()=>{render();toast('PIN ပြောင်းပြီးပါပြီ 🔒');}));break;
    case 'pinoff':openLock('verify',async()=>{await dbDel('meta','pin');delete S.meta.pin;render();toast('PIN ဖြုတ်ပြီးပါပြီ');});break;
  }
});
$('restoreFile').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)restore(f);});

/* ---------- start ---------- */
(async function init(){
  try{db=await openDB();}catch(e){$('main').innerHTML='<div class="empty"><div>⚠️</div>Database ဖွင့်လို့မရပါ။ Chrome နဲ့ ဖွင့်ကြည့်ပါ။</div>';return;}
  S.tx=await dbAll('tx');
  (await dbAll('meta')).forEach(m=>S.meta[m.key]=m.value);
  S.cats=S.meta.cats||DEFAULT_CATS.map(c=>({...c}));
  if(!S.meta.cats)await setMeta('cats',S.cats);
  render();
  if(S.meta.pin)openLock('unlock');
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().then(x=>{S.persisted=x;if(S.view==='settings')render();}).catch(()=>{});
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
